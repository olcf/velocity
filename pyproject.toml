[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olcf-velocity"
version = "0.4.1.dev0"
description = "A container build manager."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "networkx",
    "colorama",
    "loguru",
    "typing_extensions"
]

[project.optional-dependencies]
dev = [
    "ruff"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-copybutton"
]

[project.urls]
Homepage = "https://olcf.github.io/velocity"
Issues = "https://github.com/olcf/velocity/issues"

[project.scripts]
velocity = "velocity.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/velocity"]

[tool.ruff]
include = [
    "src/*"
]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
